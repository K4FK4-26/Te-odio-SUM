<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Horarios - UNMSM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Barra superior -->
        <header>
            <h1>📚 GENERADOR DE HORARIOS - UNMSM</h1>
            <button id="btnModo" class="btn-modo">🌙 Modo Oscuro</button>
        </header>

        <!-- Contenido principal -->
        <div class="main-content">
            <!-- Columna izquierda: Cursos -->
            <div class="col-izquierda">
                <h2>📋 CURSOS DISPONIBLES</h2>
                
                <!-- Navegación -->
                <div class="nav-ciclos">
                    <button id="btnAnterior" class="btn-nav">◄</button>
                    <span id="labelCiclo" class="label-ciclo">CICLO 2</span>
                    <button id="btnSiguiente" class="btn-nav">►</button>
                </div>
                
                <!-- Switch Teoría/Laboratorio -->
                <div class="switch-modo">
                    <button id="btnTeoria" class="btn-teoria activo">📖 Teoría</button>
                    <button id="btnLaboratorio" class="btn-laboratorio">🔬 Laboratorio</button>
                </div>
                
                <!-- Lista de cursos -->
                <div class="lista-cursos-container">
                    <ul id="listaCursos"></ul>
                </div>
                
                <div class="leyenda">
                    💡 Click en curso → Agregar/Quitar
                </div>
            </div>
            
            <!-- Columna derecha: Horario -->
            <div class="col-derecha">
                <div class="header-horario">
                    <h2>📅 MI HORARIO</h2>
                    <span id="labelCreditos" class="label-creditos">Créditos: 0 | Cursos: 0</span>
                </div>
                
                <!-- Tabla del horario -->
                <div class="tabla-container">
                    <table id="tablaHorario">
                        <thead>
                            <tr>
                                <th>Hora</th>
                                <th>LUNES</th>
                                <th>MARTES</th>
                                <th>MIÉRCOLES</th>
                                <th>JUEVES</th>
                                <th>VIERNES</th>
                                <th>SÁBADO</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoHorario"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Botones inferiores -->
        <div class="botones-inferiores">
            <button class="btn-generar" onclick="generarAutomatico()">⚡ Generar Automático</button>
            <button class="btn-limpiar" onclick="limpiarHorario()">🗑️ Limpiar</button>
            <button class="btn-exportar" onclick="exportarTexto()">📄 Exportar Texto</button>
        </div>
        
        <div id="labelInfo" class="label-info">
            💡 Haz click en un curso para agregarlo/quitarlo del horario
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
